description: 'Vivun is a B2B software company building AI teammates for revenue and
  sales teams using structured reasoning. Its flagship product, Hero, is an AI teammate
  built to help sellers win, and it pioneered the PreSales management category with
  tooling for sales engineering teams. Vivun also promotes a Sales Reasoning Model
  (SRM) and Agent Intelligence approach. The company is venture-backed by Accel and
  Menlo Ventures. As of this profile Vivun exposes a public product and trust surface
  (website, blog, resources, trust center) but does not publish a public developer
  API, developer portal, or OpenAPI specification; this record captures its verified
  security, compliance, and web identity for the API Evangelist network.'
